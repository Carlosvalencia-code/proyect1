name: 'Synthia CI'

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: 'Backend Tests (FastAPI & B2B Matcher)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          TESTING: 'true'
        run: |
          cd apps/api
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.log || {
            echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  build-dashboard:
    name: 'Dashboard Build (React + Vite)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'

      - name: Install dependencies
        run: |
          cd apps/dashboard
          npm install

      - name: Build Dashboard
        run: |
          cd apps/dashboard
          npm run type-check
          npm run build

  verify-widget:
    name: 'Widget SDK Validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Widget and Demo Assets
        run: |
          test -f apps/widget/src/synthia-widget.js
          test -f apps/widget/src/synthia-widget.css
          test -f apps/widget/demo/index.html
          test -f apps/widget/src/assets/frames/opt-carey-01.svg
          test -f apps/widget/src/assets/frames/opt-titan-02.svg
          test -f apps/widget/src/assets/frames/opt-aviat-03.svg
          test -f apps/widget/src/assets/frames/opt-black-04.svg
          test -f apps/widget/src/assets/frames/opt-cat-05.svg
          echo "All widget assets and try-on frame overlays verified successfully."

