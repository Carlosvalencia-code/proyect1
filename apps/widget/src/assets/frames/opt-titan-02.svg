<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Gradiente Titanio Plateado Metálico -->
    <linearGradient id="silverTitanGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b8c0c8"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#8a949e"/>
      <stop offset="100%" stop-color="#cbd2d9"/>
    </linearGradient>
    <!-- Cristal Transparente con Reflejo Oftálmico Azul/Verde -->
    <linearGradient id="clearARLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f0fdf4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="titanShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#titanShadow)">
    <!-- Patillas de titanio ultrafinas -->
    <line x1="45" y1="70" x2="8" y2="65" stroke="url(#silverTitanGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="455" y1="70" x2="492" y2="65" stroke="url(#silverTitanGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Cristales Redondos -->
    <ellipse cx="140" cy="80" rx="72" ry="58" fill="url(#clearARLens)"/>
    <ellipse cx="360" cy="80" rx="72" ry="58" fill="url(#clearARLens)"/>

    <!-- Destello diagonal en cristal -->
    <path d="M 90 40 L 170 40 L 120 125 L 75 125 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M 310 40 L 390 40 L 340 125 L 295 125 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Aros Redondos de Titanio -->
    <ellipse cx="140" cy="80" rx="72" ry="58" fill="none" stroke="url(#silverTitanGrad)" stroke-width="4.5"/>
    <ellipse cx="360" cy="80" rx="72" ry="58" fill="none" stroke="url(#silverTitanGrad)" stroke-width="4.5"/>

    <!-- Puente de Titanio Curvo Elegante -->
    <path d="M 212 76 C 230 65, 270 65, 288 76" fill="none" stroke="url(#silverTitanGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Plaquetas nasales de silicona -->
    <ellipse cx="222" cy="88" rx="4" ry="9" fill="#e2e8f0" opacity="0.85" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="278" cy="88" rx="4" ry="9" fill="#e2e8f0" opacity="0.85" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Bisagras tipo charnela nórdica -->
    <circle cx="68" cy="70" r="3" fill="#cbd2d9"/>
    <circle cx="432" cy="70" r="3" fill="#cbd2d9"/>
  </g>
</svg>
